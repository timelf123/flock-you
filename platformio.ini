[env]
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.0
    mathieucarbou/ESP Async WebServer@^3.0.6
    bblanchon/ArduinoJson@^7.0.4
build_flags = -Iinclude

[env:xiao_esp32c3]
platform = espressif32@^6.3.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps = ${env.lib_deps}
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_ENABLED=1
board_build.filesystem = spiffs
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; LCDWiki 2.8" ESP32-S3 E32C28P/E32N28P — ILI9341 + FT6336G touch
; https://www.lcdwiki.com/2.8inch_ESP32-S3_Display_E32C28P/E32N28P
[env:esp32_s3_lcdwiki_e32n28p]
platform = espressif32@^6.3.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    ${env.lib_deps}
    lvgl/lvgl@^9.2.0
    bodmer/TFT_eSPI@^2.5.43
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
board_upload.flash_size = 16MB
; LCDWiki module: ESP32-S3R8 + 8MB OPI PSRAM + 16MB flash
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DFY_TOUCH_DEBUG=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    -DCONFIG_SPIRAM_USE_MALLOC=1
    -DFY_HAS_DISPLAY=1
    -DFY_BOARD_LCDWIKI_E32C28P=1
    -DFY_HAS_TOUCH=1
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc/ui
    -include tft_user_setup.h

; Waveshare-class ESP32-S3-Touch-LCD-2.8 (ST7789) — different pinout
[env:esp32_s3_waveshare_lcd_28]
platform = espressif32@^6.3.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    ${env.lib_deps}
    lvgl/lvgl@^9.2.0
    bodmer/TFT_eSPI@^2.5.43
board_build.partitions = partitions.csv
board_build.filesystem = spiffs
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
build_flags =
    ${env.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_ARDUINO_LOOP_STACK_SIZE=32768
    -DFY_HAS_DISPLAY=1
    -DFY_BOARD_WS_TOUCH_LCD_28=1
    -DFY_HAS_TOUCH=1
    -DCORE_DEBUG_LEVEL=0
    -DCONFIG_BT_NIMBLE_ENABLED=1
    -DLV_CONF_INCLUDE_SIMPLE
    -Isrc/ui
    -include tft_user_setup_waveshare.h
